html,body{margin:0;height:100%;overflow:hidden;background:#000;overscroll-behavior:none}

.bar{background:#000;color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:12px;flex:none}
.bar img{height:38px;width:auto;display:block}
.bar .t{line-height:1.15}.bar .t b{display:block;font-size:17px;font-weight:700}.bar .t span{font-size:12px;color:#bdbdbd}
.chips{background:#000;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 12px;flex:none;scrollbar-width:none}

.chip{scroll-snap-align:start;flex:none;border:1px solid #3a3a3a;background:#161616;color:#fff;border-radius:10px;padding:7px 12px;min-height:48px;text-align:left;font:inherit;display:flex;flex-direction:column;justify-content:center}
.chip small{font-size:11.5px;color:#aaa;display:flex;gap:6px;align-items:center;white-space:nowrap}.chip b{font-size:16px;white-space:nowrap}
.chip .k{width:9px;height:9px;display:inline-block}
.chip[aria-pressed=true]{background:#fff;color:#000;border-color:#fff}.chip[aria-pressed=true] small{color:#555}
.chip.sm{justify-content:center;font-weight:500;font-size:14px}
.stage{position:relative;flex:1;background:var(--paper);overflow:hidden;touch-action:none}
svg#plan{position:absolute;inset:0;width:100%;height:100%;display:block}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#111;font:500 20px/1 inherit;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.zoom button.f{font-size:12px;font-weight:700}
.scale{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.9);font-size:11px;padding:5px 7px;border-radius:4px}
.sheet{position:absolute;will-change:height;left:0;right:0;bottom:0;background:var(--sheet);border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.16);display:flex;flex-direction:column;
 height:calc(118px + var(--safe-b));transition:height .22s ease;z-index:5}
.sheet.open{height:78%}
.sheet:not(.open) .body{visibility:hidden}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{flex:none;display:flex;justify-content:center;padding:10px 0 6px;touch-action:none;cursor:grab}
.peek{touch-action:none;cursor:grab}
.sheet.dragging{transition:none}
.hint{font-size:11.5px;color:#9a9a9a;text-align:center;margin-top:-2px}
.grab i{width:40px;height:5px;border-radius:3px;background:#cfcfcf}
.peek{flex:none;padding:2px 18px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.peek .meta{font-size:12.5px;color:var(--mut)}.peek .nm{font-size:17px;font-weight:700;line-height:1.2}
.peek .ar{font-size:30px;font-weight:900;line-height:1;white-space:nowrap}
.more{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:0 14px;height:36px;font:500 13px inherit;color:#111}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(16px + var(--safe-b));border-top:1px solid var(--line)}
.tabs{display:flex;gap:6px;position:sticky;top:0;background:#fff;padding:10px 0;z-index:2}
.tabs button{flex:1;height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;font:500 14px inherit;color:#111}
.tabs button[aria-selected=true]{background:#111;color:#fff;border-color:#111}
input[type=search]{-webkit-user-select:text;user-select:text;width:100%;font:16px inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;-webkit-appearance:none}
.grp{display:flex;justify-content:space-between;font-weight:700;font-size:13.5px;padding:12px 0 6px;border-bottom:1px solid #111}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14.5px}
.row.on{background:#f3f1ec}.row span{display:flex;gap:9px;align-items:flex-start}.row b{font-weight:500;white-space:nowrap}
.row .sw{width:11px;height:11px;flex:none;margin-top:4px;border:1px solid rgba(0,0,0,.2)}
.row em{display:block;font-style:normal;color:var(--mut);font-size:12px}
.lay label{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);font-size:15px}
.lay input{width:22px;height:22px;accent-color:#111}
.note{font-size:12px;color:var(--mut);padding:12px 0}

 pk.innerHTML=`<div class="meta">${rows.length} spaces${FIL==='all'?` · lot ${f1(D.lot)} m²`:` · ${(t/D.lot*100).toFixed(1)} % of lot`}</div><div class="nm">${NAME[FIL]}</div><div class="ar">${f1(t)} m²</div>`};
const select=a=>{cur=a;$('sel').innerHTML=a?`<path d="${a.d}" fill="${a.mod?'#111':col(a)}" fill-opacity="${a.mod?.15:.35}" stroke="#111" stroke-width=".35" fill-rule="evenodd"/>`:'';
 for(const r of document.querySelectorAll('.row'))r.classList.toggle('on',!!a&&+r.dataset.i===a.id&&!a.mod);peek()};
svg.addEventListener('click',e=>{if(moved)return;const tg=e.target.closest('.tr');if(tg){const t=D.trees[tg.dataset.t];cur={tree:true,t};$('sel').innerHTML=`<circle cx="${t[0]}" cy="${t[1]}" r="${t[2]+.3}" fill="none" stroke="#111" stroke-width=".3"/>`;peek();return}const p=e.target.closest('.ar,.md');if(!p){select(null);return}
 if(p.classList.contains('md')){const m=D.modules[p.dataset.m];select({...m,mod:true,mi:+p.dataset.m})}else select(D.areas[p.dataset.i])});
const toggle=o=>{sheet.style.height='';sheet.classList.toggle('open',o)};
{const zone=[$('grab'),$('peekwrap')];let st=null;
 const hMin=()=>118+(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-b'))||0),hMax=()=>stage.clientHeight*.78;
 for(const z of zone){
  z.addEventListener('pointerdown',e=>{st={y:e.clientY,h:sheet.getBoundingClientRect().height,t:Date.now(),moved:false};z.setPointerCapture(e.pointerId);sheet.classList.add('dragging')});
  z.addEventListener('pointermove',e=>{if(!st)return;const dy=e.clientY-st.y;if(Math.abs(dy)>4)st.moved=true;sheet.style.height=Math.min(Math.max(st.h-dy,hMin()),hMax())+'px'});
  const end=e=>{if(!st)return;sheet.classList.remove('dragging');const dy=e.clientY-st.y,v=dy/Math.max(Date.now()-st.t,1),h=sheet.getBoundingClientRect().height;
   const open=!st.moved?!sheet.classList.contains('open'):(v<-.35?true:v>.35?false:h>(hMin()+hMax())/2);st=null;toggle(open)};
  z.addEventListener('pointerup',end);z.addEventListener('pointercancel',end)}}
for(const b of document.querySelectorAll('.tabs button'))b.onclick=()=>{for(const x of document.querySelectorAll('.tabs button'))x.setAttribute('aria-selected',x===b);$('t-list').hidden=b.dataset.t!=='list';$('t-lay').hidden=b.dataset.t!=='lay'};
// ---- list
const GR=['Interior','Exterior built','Exterior park'];
const drawList=()=>{const q=$('q').value.toLowerCase();
 if(FIL==='modules'){$('sched').innerHTML=['1','2','3'].map(w=>{const ms=D.modules.map((m,i)=>({...m,i})).filter(m=>m.wing==w&&(m.name.toLowerCase().includes(q)));if(!ms.length)return'';
  return`<div class="grp"><span>${WN[w]}</span><span>${f1(ms.reduce((s,m)=>s+m.area,0))} m²</span></div>`+ms.map(m=>`<div class="row" data-m="${m.i}"><span><i class="sw" style="background:${MC[m.i]}"></i><span>Module ${MI[m.i]+1}<em>${m.name}</em></span></span><b>${f1(m.area)}</b></div>`).join('')}).join('');return}
 $('sched').innerHTML=GR.map(g=>{const rows=D.areas.filter(a=>a.grp===g&&inF(a)&&(a.name.toLowerCase().includes(q)||(WN[a.wing]||'').toLowerCase().includes(q)));if(!rows.length)return'';
 return`<div class="grp"><span>${g}</span><span>${f1(rows.reduce((s,a)=>s+a.area,0))} m²</span></div>`+rows.map(a=>`<div class="row" data-i="${a.id}"><span><i class="sw" style="background:${col(a)};opacity:${Math.max(op(a),.45)}"></i><span>${a.name}${WN[a.wing]?`<em>${WN[a.wing]}</em>`:''}</span></span><b>${f1(a.area)}</b></div>`).join('')}).join('')||'<div class="note">No space matches.</div>'};
$('sched').onclick=e=>{const r=e.target.closest('.row');if(!r)return;const isM=r.dataset.m!=null;const a=isM?{...D.modules[r.dataset.m],mod:true,mi:+r.dataset.m}:D.areas[r.dataset.i];select(a);toggle(false);
 const p=isM?svg.querySelector(`.md[data-m="${r.dataset.m}"]`):svg.querySelector(`.ar[data-i="${a.id}"]`),b=p.getBBox(),pad=12,rr=rect();const k=Math.max((b.width+pad*2)/rr.width,(b.height+pad*2)/(rr.height-118));vb={x:b.x+b.width/2-rr.width*k/2,y:b.y+b.height/2-(rr.height-118)*k/2,w:rr.width*k,h:rr.height*k};setVB()};
$('q').oninput=drawList;
// ---- layers
const LAY=[['labels','Area names',0],['contours','Contours',1],['creek','Creek',1],['trees','Survey trees · removals in red',0],['floor','Paving lines',1],['walls','Walls & furniture',1],['treenets','Tree nets',1],['property','Property line',1],['building','Building',1],['cols','Columns',1]];
$('t-lay').innerHTML=LAY.map(([k,n,o])=>`<label>${n}<input type="checkbox" data-k="${k}" ${o?'checked':''}></label>`).join('');
$('t-lay').onchange=e=>{const g=$('L-'+e.target.dataset.k);if(g)g.style.display=e.target.checked?'':'none';if(e.target.dataset.k==='trees'){TREES=e.target.checked;cur=null;$('sel').innerHTML='';peek()}};
drawList();peek();requestAnimationFrame(()=>{const r=rect();if(r.width>50&&r.height>150){fitted=true;fit()}});addEventListener('load',()=>{fitted=true;fit()});
}
</script></body></html>
